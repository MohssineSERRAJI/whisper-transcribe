[project]
name = "whisper-transcribe"
version = "0.1.0"
description = "Transcribe Arabic (darija) and French audio with Whisper large-v3 on Apple Silicon (MLX)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mlx-whisper>=0.4.2",
    "mcp>=2",
]

[project.scripts]
transcribe = "whisper_transcribe.cli:main"
transcribe-mcp = "whisper_transcribe.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_transcribe"]
